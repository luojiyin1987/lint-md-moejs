name: Compatibility spike

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test moejs module handling
        run: go test ./...
      - name: Install JavaScript dependencies
        run: npm install --prefix js --no-audit --no-fund
      - name: Bundle lint-md core
        run: npm run build --prefix js
      - name: Compare diagnostics with Node.js
        run: npm run compare --prefix js
      - name: Compare multi-round fixes with Node.js
        run: npm run compare:fix --prefix js
      - name: Build benchmark binary outside measurements
        run: go build -o bench/lint-md-go ./cmd/bench
      - name: Test semantic JSON comparator
        run: node --test bench/semantic.test.mjs
      - name: Benchmark harness smoke (correctness, no perf thresholds)
        run: npm run bench:smoke --prefix js
      - name: Profile flags smoke (no performance assertions)
        run: |
          node --input-type=module -e "import { fixture } from './bench/workload.mjs'; process.stdout.write(fixture(32))" > /tmp/lint-md-profile-input.md
          ./bench/lint-md-go -bundle js/dist/lint-md.mjs -mode parse -iterations 5 -warmup 1 -cpu-profile /tmp/lint-md-cpu.pprof -heap-profile /tmp/lint-md-heap.pprof < /tmp/lint-md-profile-input.md > /tmp/lint-md-profile.json
          test -s /tmp/lint-md-cpu.pprof
          test -s /tmp/lint-md-heap.pprof
          node -e "const r=require('/tmp/lint-md-profile.json');if(r.mode!=='parse'||!r.digest||!r.warm)process.exit(1)"
          go tool pprof -top /tmp/lint-md-cpu.pprof > /dev/null
          go tool pprof -alloc_space -top /tmp/lint-md-heap.pprof > /dev/null
