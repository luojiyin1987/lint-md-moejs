name: Compatibility spike

on:
  push:
    branches:
      - main
      - spike/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install --prefix js --no-audit --no-fund
      - name: Bundle lint-md core
        run: npm run build --prefix js
      - name: Download Go dependencies
        run: go mod download
      - name: Test moejs module handling
        run: go test ./...
      - name: Compare diagnostics with Node.js
        run: npm run compare --prefix js
